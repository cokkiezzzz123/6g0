<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090713">
<meta name="description" content="Một món quà nhỏ dành tặng cô Nga nhân ngày Nhà giáo Việt Nam 20/11.">
<title>Gửi cô Nga · 20/11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style id="presentation-styles">
:root {
  color-scheme: dark;
  --rose: #e8bacb;
  --warm: #ecd7b7;
  --white: #f5eef2;
  --ease: cubic-bezier(.2,.75,.2,1);
  font-family: "Be Vietnam Pro",sans-serif
}

[hidden] { display: none !important; }

.globe-controls {
  position: absolute;
  left: 50%;
  bottom: max(7vh, 56px);
  transform: translateX(-50%);
  z-index: 650;
}
.icon-button.album-button { width: 82px; gap: 9px; border-radius: 28px; }
.album-button .small-arrow { width: 13px; height: 18px; opacity: .6; }
body:not([data-scene="globe"]) .globe-controls { display: none; }
.photo-tile.related { box-shadow: 0 0 0 1px #f0d1d7, 0 0 15px #e2afc459; filter: brightness(1.08); }
.journey-shell { position: absolute; inset: 0; z-index: 700; }
.journey-view { position: absolute; inset: 0; animation: chapter-enter .65s var(--ease); }
@keyframes chapter-enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.journey-controls {
  position: absolute;
  left: 50%;
  bottom: max(7vh, 56px);
  transform: translateX(-50%);
  display: flex;
  gap: 18px;
  align-items: center;
  justify-content: center;
  z-index: 30;
}
.icon-button.chapter-next { color: #f1dfd0; border-color: #d9b5c647; }
.back-arrow svg { transform: rotate(180deg); }
.journey-progress {
  position: absolute;
  left: 50%;
  bottom: max(22px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex;
  gap: 9px;
  z-index: 900;
  pointer-events: none;
}
.journey-progress span { width: 3px; height: 3px; border-radius: 50%; background: #cdb7c238; transition: background .4s, transform .4s; }
.journey-progress span.active { background: #e4bbc9; transform: scale(1.5); }
.ribbon-stage { position: absolute; inset: 0; perspective: 1200px; touch-action: none; user-select: none; }
.ribbon-photo {
  position: absolute;
  left: 0;
  top: 0;
  border: 4px solid #f5eae1;
  border-radius: 3px;
  padding: 0;
  background: #16111c;
  box-shadow: 0 18px 50px #0004;
  overflow: hidden;
  cursor: zoom-in;
  touch-action: none;
  will-change: transform;
}
.ribbon-photo img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
.ribbon-photo:hover { border-color: #ffe8da; }
.ribbon-nav { position: absolute; top: calc(43% - 22px); z-index: 20; }
.ribbon-prev { left: max(24px, calc(50% - 440px)); }
.ribbon-prev svg { transform: rotate(180deg); }
.ribbon-next { right: max(24px, calc(50% - 440px)); }
.ribbon-count { position: absolute; top: 72%; width: 100%; text-align: center; color: #bcacbc; font-size: 10px; letter-spacing: .25em; pointer-events: none; }
.wish-tilt {
  position: absolute;
  left: 50%;
  top: 44%;
  width: min(360px, calc(100vw - 88px));
  height: min(420px, 55vh);
  perspective: 1300px;
  transform: translate(-50%,-50%);
  transform-style: preserve-3d;
}
.wish-card {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  padding: 0;
  border-radius: 6px;
  background: transparent;
  color: #6a4d58;
  transform-style: preserve-3d;
  transition: transform .75s var(--ease);
  cursor: pointer;
}
.wish-card.flipped { transform: rotateY(180deg); }
.wish-face {
  position: absolute;
  inset: 0;
  border-radius: 6px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 20px 60px #0004;
  overflow: hidden;
}
.wish-front { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 38px; background: #fff2e9; border: 1px solid #fff8f0; }
.wish-front:before { content: ""; position: absolute; inset: 14px; border: 1px solid #c6a1aa42; border-radius: 2px; pointer-events: none; }
.wish-icon { width: 42px; height: 42px; stroke: #b67e94; stroke-width: 1.1; }
.wish-text { font-family: "Playfair Display",Georgia,serif; font-size: clamp(25px,3vw,31px); font-weight: 500; line-height: 1.55; }
.wish-corner { position: absolute; bottom: 0; right: 0; width: 25px; height: 25px; background: linear-gradient(135deg,#f2d7d5 49%,#cb9caa 50%,transparent 54%); }
.wish-back { padding: 10px; background: #fff2e9; transform: rotateY(180deg); cursor: zoom-in; }
.wish-back img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
.wish-dots { position: absolute; top: 76%; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; }
.wish-dots button { width: 26px; height: 26px; background: none; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer; }
.wish-dots button:before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: #a589a06b; transition: background .25s, transform .25s; }
.wish-dots button[aria-pressed="true"]:before { background: #e4bdcb; transform: scale(1.45); }
.constellation-lines { position: absolute; inset: 0; width: 100%; height: 100%; stroke: #debaca40; stroke-width: .8; fill: none; pointer-events: none; }
.constellation-lines line { stroke-dasharray: 1; stroke-dashoffset: 1; }
.constellation-photos { position: absolute; inset: 0; pointer-events: none; }
.star-photo { position: absolute; left: 0; top: 0; padding: 2px; background: #eadfdb; border: 0; border-radius: 2px; box-shadow: 0 0 17px #e3aecb13; cursor: zoom-in; pointer-events: auto; z-index: 5; }
.star-photo img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
.star-photo:hover,.star-photo:focus-visible { box-shadow: 0 0 0 1px #f0d3ce,0 0 24px #e4b7cc5c; }
.constellation-spark { position: absolute; left: 0; top: 0; width: 6px; height: 6px; border-radius: 50%; background: #ffe3bd; box-shadow: 0 0 12px #ffd4a9,0 0 24px #ebb8ce; pointer-events: none; z-index: 2; }
.constellation-scene .envelope-button { top: calc(46% - 50px); bottom: auto; z-index: 10; }
.constellation-controls { bottom: max(7vh,56px); }
.collage-photo { display: block; border: 0; padding: 0; min-width: 0; min-height: 0; background: none; cursor: zoom-in; overflow: hidden; }
.collage > :first-child,.collage > :last-child { grid-column: span 2; }
.collage-photo:focus-visible { outline-offset: 2px; }
.collage-photo img { pointer-events: none; }
body[data-scene="letter"] .journey-progress,body[data-scene="sending"] .journey-progress { display: none; }
@media(max-width:600px) {
  .ribbon-photo { border-width: 3px; }
  .ribbon-prev { left: 14px; }
  .ribbon-next { right: 14px; }
  .ribbon-nav { width: 34px; height: 34px; top: calc(43% - 17px); }
  .ribbon-nav svg { width: 18px; }
  .wish-front { padding: 29px; gap: 25px; }
  .wish-text { font-size: 26px; }
  .constellation-scene .envelope-button { transform: translateX(-50%) scale(.9); }
}
@media(max-height:600px) {
  .globe-controls,.journey-controls { bottom: 40px; }
  .journey-progress { bottom: 15px; }
  .wish-tilt { top: 41%; height: min(290px,calc(100dvh - 170px)); width: min(320px,calc(100vw - 100px)); }
  .wish-front { padding: 24px; gap: 14px; }
  .wish-icon { width: 26px; height: 26px; }
  .wish-text { font-size: 22px; line-height: 1.4; }
  .wish-dots { top: auto; bottom: 91px; }
  .ribbon-count { top: 70%; }
}

* {
  box-sizing: border-box
}

html,body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden
}

body {
  background: #090713;
  color: var(--white);
  overscroll-behavior: none
}

button {
  -webkit-tap-highlight-color: transparent;
  font: inherit
}

button:focus-visible {
  outline: 2px solid var(--warm);
  outline-offset: 7px
}

button:disabled {
  pointer-events: none
}

svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round
}

.svg-defs {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden
}

#universe {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none
}

.scene-vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 44%,transparent 25%,#05030ca6 100%);
  z-index: 2
}

.topbar {
  position: fixed;
  top: max(30px,env(safe-area-inset-top));
  left: 40px;
  right: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
  pointer-events: none
}

.date-mark {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: .22em;
  color: #b9aab9;
  display: flex;
  align-items: center;
  gap: 8px
}

.date-mark i {
  font-style: normal;
  color: #7d657d
}

.date-star {
  font-size: 22px;
  color: var(--rose);
  margin-right: 4px
}

.icon-button {
  width: 44px;
  height: 44px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  border: 1px solid #ffffff20;
  border-radius: 50%;
  color: #e5d8e0;
  background: #18111d99;
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: transform .25s,background .25s,border-color .25s,box-shadow .25s;
  pointer-events: auto
}

.icon-button:hover {
  transform: translateY(-2px);
  border-color: #d8a6be70;
  background: #2a1e2d;
  box-shadow: 0 3px 16px #0002
}

.icon-button:active {
  transform: scale(.92)
}

.music-button {
  position: relative
}

.music-button[aria-pressed="true"] {
  border-color: #d9b0c24f;
  box-shadow: none
}

.music-button svg {
  width: 20px
}

.music-slash {
  position: absolute;
  width: 24px;
  height: 1px;
  background: var(--rose);
  transform: rotate(-45deg);
  box-shadow: 0 0 0 2px #1a0f23
}

.music-button[aria-pressed="true"] .music-slash {
  display: none
}

#experience {
  position: fixed;
  inset: 0;
  z-index: 3
}

.intro {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  pointer-events: none;
  transition: opacity 1s,transform 1.3s var(--ease);
  opacity: 0;
  transform: translateY(18px) scale(.97)
}

body[data-scene="intro"] .intro {
  opacity: 1;
  transform: none
}

.intro-eyebrow {
  font-size: 11px;
  letter-spacing: .65em;
  color: var(--rose);
  margin-bottom: 22px;
  padding-left: .65em
}

.intro h1 {
  font-family: "Playfair Display",Georgia,serif;
  font-weight: 500;
  font-size: clamp(36px,5.2vw,64px);
  line-height: 1.25;
  text-align: center;
  margin: 0;
  text-shadow: none
}

.intro h1 span {
  display: block;
  font-size: .36em;
  font-style: italic;
  color: #c7b8c6;
  margin-top: 20px;
  font-weight: 400;
  letter-spacing: .015em
}

.intro-flourish {
  display: flex;
  align-items: center;
  gap: 18px;
  color: var(--rose);
  margin-top: 32px
}

.intro-flourish span {
  width: 65px;
  height: 1px;
  background: linear-gradient(90deg,transparent,#bf869f)
}

.intro-flourish span:last-child {
  transform: rotate(180deg)
}

.gallery {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s
}

.gallery.visible {
  opacity: 1;
  pointer-events: auto
}

.globe {
  position: absolute;
  inset: 0;
  touch-action: none;
  cursor: grab;
  user-select: none
}

.globe.dragging {
  cursor: grabbing
}

.photo-tile {
  position: absolute;
  top: 0;
  left: 0;
  width: 78px;
  height: 58px;
  padding: 1.5px;
  background: #e7dedc;
  border: 0;
  border-radius: 1px;
  box-shadow: 0 2px 7px #0003;
  cursor: pointer;
  will-change: transform;
  transform-origin: center;
  touch-action: none;
  transition: box-shadow .22s,filter .22s;
  user-select: none
}

.photo-tile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  -webkit-user-drag: none
}

.photo-tile:hover,.photo-tile:focus-visible {
  box-shadow: 0 0 0 1px #f8e9d6,0 0 12px #e7b4c44d;
  filter: brightness(1.08)
}

.orbit {
  position: absolute;
  top: 46%;
  left: 50%;
  width: min(76vw,780px);
  height: min(76vw,780px);
  border: 1px solid #d7acb320;
  border-radius: 50%;
  pointer-events: none;
  opacity: .6;
  transition: opacity .7s
}

.orbit-a {
  transform: translate(-50%,-50%) rotate(-25deg) scaleY(.32)
}

.orbit-b {
  transform: translate(-50%,-50%) rotate(36deg) scaleY(.46);
  border-color: #b897c219
}

.orbit:after {
  content: "";
  position: absolute;
  left: 50%;
  top: -3px;
  width: 5px;
  height: 5px;
  background: #ffdba5;
  border-radius: 50%;
  box-shadow: 0 0 14px #ffc992
}

.gesture-hint {
  position: absolute;
  left: 50%;
  top: 48%;
  width: 60px;
  height: 70px;
  pointer-events: none;
  opacity: 0;
  z-index: 500;
  filter: drop-shadow(0 0 5px #000)
}

.gesture-hint svg {
  width: 32px;
  height: 42px;
  fill: #100c18a0;
  stroke: #fff;
  stroke-width: 1.5
}

.gesture-hint.show {
  animation: hand-swipe 2.5s ease-in-out 1
}

.gesture-hint span {
  position: absolute;
  left: -30px;
  top: 40px;
  width: 80px;
  height: 1px;
  background: linear-gradient(90deg,transparent,#fff9,transparent)
}

@keyframes hand-swipe {
  0%,100% {
    opacity: 0;
    transform: translateX(-40px) rotate(-10deg)
  }
  25% {
    opacity: .9
  }
  70% {
    opacity: .9;
    transform: translateX(40px) rotate(10deg)
  }
}

.envelope-button {
  position: absolute;
  bottom: max(6vh,30px);
  left: 50%;
  transform: translateX(-50%);
  width: 122px;
  height: 100px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  opacity: 0;
  transition: opacity .7s,filter .3s;
  isolation: isolate;
  z-index: 600
}

.envelope-button.ready {
  opacity: 1
}

.envelope-body {
  display: block;
  position: absolute;
  bottom: 10px;
  left: 14px;
  width: 94px;
  height: 64px;
  background: #d8a9ba;
  border-radius: 3px;
  box-shadow: 0 8px 24px #0004;
  animation: envelope-float 5s ease-in-out infinite;
  transform-style: preserve-3d
}

.envelope-note {
  position: absolute;
  left: 8px;
  right: 8px;
  height: 56px;
  bottom: 10px;
  background: #fff0db;
  color: #cd6e8e;
  padding-top: 6px;
  font-size: 24px;
  border-radius: 2px;
  transition: transform .4s
}

.envelope-flap {
  position: absolute;
  top: -1px;
  left: 0;
  width: 0;
  height: 0;
  border-left: 47px solid transparent;
  border-right: 47px solid transparent;
  border-top: 37px solid #e7bdcc;
  z-index: 3;
  transform-origin: top;
  transition: transform .4s
}

.envelope-pocket {
  position: absolute;
  inset: 0;
  border-radius: 3px;
  z-index: 4;
  background: linear-gradient(34deg,#cd97ad 49%,transparent 50%) left/51% 100% no-repeat,linear-gradient(-34deg,#dcaec1 49%,transparent 50%) right/51% 100% no-repeat
}

.envelope-seal {
  position: absolute;
  z-index: 5;
  top: 26px;
  left: 35px;
  background: #b77b94;
  color: #fff0ed;
  width: 25px;
  height: 25px;
  border: 1px solid #e9bfcf;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 11px;
  box-shadow: 0 2px 4px #78324b22
}

.envelope-aura {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse,#df98bd16,transparent 66%);
  transform: scale(1.4)
}

.envelope-button:hover .envelope-flap,.envelope-button:focus-visible .envelope-flap {
  transform: rotateX(155deg)
}

.envelope-button:hover .envelope-note,.envelope-button:focus-visible .envelope-note {
  transform: translateY(-13px)
}

.envelope-button:hover {
  filter: drop-shadow(0 0 15px #e8acc044)
}

.envelope-spark {
  position: absolute;
  color: var(--warm);
  animation: twinkle 3s ease-in-out infinite
}

.spark-one {
  left: 0;
  top: 15px;
  font-size: 19px
}

.spark-two {
  right: 2px;
  bottom: 10px;
  font-size: 11px;
  animation-delay: 1.5s
}

@keyframes envelope-float {
  50% {
    transform: translateY(-4px)
  }
}

@keyframes twinkle {
  50% {
    opacity: .3;
    transform: scale(.7)
  }
}

dialog {
  color: inherit;
  border: 0;
  padding: 0;
  max-width: none;
  max-height: none;
  outline: none
}

dialog::backdrop {
  background: #05030ccc;
  backdrop-filter: blur(9px)
}

.photo-dialog {
  background: transparent;
  overflow: visible;
  width: min(1000px,94vw);
  height: min(790px,86dvh);
  animation: dialog-in .35s var(--ease)
}

.photo-dialog figure {
  margin: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 15px;
  pointer-events: none
}

.photo-dialog img {
  max-width: calc(100% - 130px);
  max-height: calc(100% - 50px);
  object-fit: contain;
  border: 3px solid #f3e9e4;
  border-radius: 2px;
  box-shadow: 0 16px 50px #0005;
  pointer-events: auto;
  user-select: none;
  -webkit-user-drag: none
}

.photo-dialog figcaption {
  font-size: 11px;
  letter-spacing: .2em;
  color: #d8becf
}

.dialog-close {
  position: absolute;
  right: 8px;
  top: -12px;
  width: 36px;
  height: 36px;
  z-index: 10
}

.photo-nav {
  position: absolute;
  top: calc(50% - 22px);
  z-index: 5
}

.photo-prev {
  left: 0
}

.photo-prev svg {
  transform: rotate(180deg)
}

.photo-next {
  right: 0
}

@keyframes dialog-in {
  from {
    opacity: 0;
    transform: translateY(15px) scale(.94)
  }
  to {
    opacity: 1;
    transform: none
  }
}

.letter-dialog {
  width: min(440px,calc(100vw - 42px));
  height: min(550px,calc(100dvh - 76px));
  background: transparent;
  overflow: visible;
  perspective: 1400px;
  animation: dialog-in .65s var(--ease)
}

.letter-dialog::backdrop {
  background: #07030bbd
}

.letter-dialog .dialog-close {
  right: -15px;
  top: -15px
}

.letter-card {
  width: 100%;
  height: calc(100% - 72px);
  min-height: 290px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .8s var(--ease)
}

.letter-card.flipped {
  transform: rotateY(180deg)
}

.letter-face {
  position: absolute;
  inset: 0;
  border-radius: 6px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  color: #61474e;
  background: #fff3ec;
  box-shadow: 0 16px 60px #0005
}

.letter-front {
  padding: clamp(25px,6vw,48px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #fff4ed;
  border: 1px solid #fff9f3
}

.letter-front:before {
  content: "";
  position: absolute;
  inset: 18px;
  border: 1px solid #bb899a33;
  border-radius: 2px;
  pointer-events: none
}

.letter-date {
  font-size: 9px;
  letter-spacing: .36em;
  color: #9e7d89;
  position: absolute;
  top: 36px
}

.letter-ornament {
  font-size: 28px;
  color: #bf8394;
  margin: 10px 0
}

.letter-front h2 {
  font-family: "Playfair Display",Georgia,serif;
  font-size: clamp(29px,5vw,36px);
  font-style: italic;
  font-weight: 500;
  margin: 5px 0 24px;
  color: #915e70
}

.letter-front p {
  font-size: clamp(17px,2.5vw,20px);
  font-weight: 400;
  line-height: 1.9;
  text-align: center;
  max-width: 300px;
  margin: 0;
  color: #654e55
}

.letter-flourish {
  font-family: Georgia,serif;
  font-size: 30px;
  color: #bc8a9b;

.paper-corner {

}

.letter-back {
  transform: rotateY(180deg);
  padding: 20px 20px 36px;
  background: #fff4ed
}

.collage {
  height: 100%;
  display: grid;

  grid-template-rows: repeat(4,1fr);
  gap: 8px
}

.collage img {
  width: 100%;
  height: 100%;
  min-height: 0;
  object-fit: cover;
  border: 2px solid #fff;
  box-shadow: none;
  transform: none
}

.collage img:first-child,.collage img:last-child {
  grid-column: span 2
}

.collage-heart {
  position: absolute;
  bottom: 5px;
  left: calc(50% - 10px);
  font-size: 22px;
  color: #b08292
}

.letter-controls {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: center;
  padding-top: 18px

.letter-controls .icon-button {
  background: #2e1c32b3

.send-button {
  color: #ecd7b7;
  border-color: #d9b8924d
}

.send-button:hover {
  box-shadow: 0 3px 18px #0002
}

.letter-dialog.sending .letter-card {
  animation: fold-letter .65s var(--ease) forwards
}

.letter-dialog.sending .letter-controls,.letter-dialog.sending .dialog-close {
  opacity: 0;
  pointer-events: none
}

@keyframes fold-letter {
  to {
    transform: rotateX(78deg) rotateZ(-20deg) scale(.12);
    opacity: 0
  }
}

.flight-plane {
  position: fixed;
  z-index: 40;
  width: 65px;
  height: 65px;
  color: #ffe5b6;
  display: none;
  filter: drop-shadow(0 0 9px #ffc68d66);
  pointer-events: none
}

.flight-plane svg {
  width: 100%;
  height: 100%;
  fill: #ffefd71a;
  stroke-width: .9
}

.finale {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s
}

.finale.visible {
  opacity: 1
}

.finale-copy {
  position: absolute;
  left: 50%;
  top: 72%;
  transform: translate(-50%,-50%);
  width: 90%;
  text-align: center;
  opacity: 0;
  transition: opacity 1.5s
}

.finale.visible .finale-copy {
  opacity: 1
}

.finale-date {
  font-size: 10px;
  letter-spacing: .5em;
  color: #b798ac
}

.finale h2 {
  font-family: "Playfair Display",Georgia,serif;
  font-weight: 500;
  font-size: clamp(21px,2.8vw,30px);
  line-height: 1.55;
  margin: 0;
  color: #f3e8ed
}

.finale h2 em {
  color: #eeb5c7;
  font-weight: 500
}

.finale-heart {
  display: block;
  color: #dca0b8;
  font-size: 25px;
  margin-top: 8px
}

.replay-button {
  position: absolute;
  bottom: max(24px,5vh);
  left: calc(50% - 22px);
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s,transform .3s
}

.finale.visible .replay-button {
  opacity: 1;
  pointer-events: auto
}

.portal-flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background: radial-gradient(ellipse,#fff9e9 10%,#f8d4d8 55%,#d5c1dc);
  opacity: 0
}

.cursor-star {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 80;
  font-size: 9px;
  color: #f3dfd2;
  text-shadow: 0 0 10px #edc3b8;
  opacity: 0;
  transform: translate(-50%,-50%);
  transition: opacity .5s
}

.noscript {
  position: fixed;
  inset: 40% 10% auto;
  text-align: center;
  color: #fff;
  z-index: 100
}

body[data-scene="envelope"] .orbit,body[data-scene="letter"] .orbit,body[data-scene="finale"] .orbit,body[data-scene="restart"] .orbit {

document.addEventListener("DOMContentLoaded", function () {
/*
 * Photo globe: sphere placement, outward-facing photo cards, and CSS3DRenderer

 * https://github.com/guiconga/6g0

  // webglCore: true uses a shaded WebGL sphere when the browser supports it.

    friction: 0.85,
    stopSpeed: 0.012,
    maxSpeed: 7,
    releaseWindow: 0.12,
    webglCore: true
  };

  class SpinPhysics {
    constructor(options) {
      this.options = Object.assign({}, SETTINGS, options);
      if (!(this.options.friction > 0) || !(this.options.stopSpeed > 0))

      this.orientation = new THREE.Quaternion();
      this.velocity = new THREE.Vector3();
      this.previous = new THREE.Vector3();
      this.delta = new THREE.Quaternion();
      this.axis = new THREE.Vector3();
      this.dragging = false;
      this.lastMoveTime = 0;

    reset() {
      this.orientation.setFromEuler(new THREE.Euler(-0.12, 0, 0));
      this.stop(); this.dragging = false;

    // Sphere centre and radius are in screen pixels. A hyperbolic outer region
    // avoids sudden jumps if a drag moves beyond the edge of the globe.
    project(x, y, geometry) {
      const px = (x - geometry.x) / geometry.radius;
      const py = (geometry.y - y) / geometry.radius;
      const distance2 = px * px + py * py;
      const z = distance2 <= 0.5 ? Math.sqrt(1 - distance2) : 0.5 / Math.sqrt(distance2);
      return new THREE.Vector3(px, py, z).normalize();
    }
    begin(x, y, time, geometry) {
      this.stop(); this.dragging = true;
      this.previous.copy(this.project(x, y, geometry));
      this.lastMoveTime = time;
    }
    move(x, y, time, geometry) {
      if (!this.dragging) return;
      const elapsed = time - this.lastMoveTime;
      if (!(elapsed > 0)) return;

    const y = tile.y * Math.cos(p) - z0 * Math.sin(p);
    const z = tile.y * Math.sin(p) + z0 * Math.cos(p);
    const perspective = 850 / (850 - z * radius);
    const glow = hovered === i ? 1.12 : 1;
    return { x: width / 2 + x * radius * perspective,
      y: height * .44 + y * radius * perspective,
      scale: perspective * (width < 600 ? .7 : .9) * glow,
      stretch: clamp(z * 1.15, .28, 1), rotation: x * 8,
      opacity: smooth((z + .02) * 4), z: Math.round(200 + z * 100) };
  }
  function heartPosition(tile, i, now) {
    const p = heartPoints[i];
    const r = Math.min(width * .27, height * .21, 225);
    const wave = reduced ? 0 : Math.sin(now * .0006 + tile.float) * .8;
    const mx = pointer.active && !reduced ? (pointer.x / width - .5) * 12 : 0;
    return { x: width / 2 + p.x * r + mx,
      y: height * .32 + p.y * r + wave, scale: width < 600 ? .32 : .48,
      stretch: 1, rotation: Math.sin(tile.float) * 5, opacity: .94, z: 100 + Math.round(p.y * 10) };
  }
  function tunnelPosition(tile, i, progress, kind) {
    const travel = kind === "restart" ? Math.pow(progress, 2.25) * 5.5 : progress * 2;
    const depth = ((tile.depth - travel) % 2.8 + 2.8) % 2.8;
    const perspective = .8 / (depth + .13);
    const angle = tile.angle + progress * (kind === "restart" ? 1.8 : .45);
    const radial = Math.min(width, height) * .38 * perspective;
    const centreBlend = ease(progress / .35);
    const cx = kind === "restart" ? lerp(transition.x, width / 2, centreBlend) : width / 2;
    const cy = kind === "restart" ? lerp(transition.y, height / 2, centreBlend) : height / 2;
    return { x: cx + Math.cos(angle) * radial * 1.25,
      y: cy + Math.sin(angle) * radial, scale: perspective * .8,
      stretch: 1, rotation: Math.sin(angle) * 20 + progress * 20,
      opacity: clamp(depth / .12) * clamp((2.8 - depth) / .4), z: Math.round(800 - depth * 200) };
  }
  function mixPosition(a, b, t) {
    const out = {};
    for (const key of ["x", "y", "scale", "stretch", "rotation", "opacity", "z"]) out[key] = lerp(a[key], b[key], t);
    return out;
  }
  function renderTiles(now, dt, seconds) {
    if (["intro","ribbon","wishes","constellation"].includes(scene)) return;
    if (rigidGlobe) {
      if (scene === "globe" && !photoDialog.open && !reduced) rigidGlobe.physics.step(seconds);
      else if (reduced) rigidGlobe.physics.stop();
      const enter = reduced || restore ? 1 : ease((now - sceneStart) / 1600);
      rigidGlobe.prepare(enter);
      if (scene === "globe" && !restore) {
        rigidGlobe.setActive(true);
        rigidGlobe.render();
        return;
      }
      rigidGlobe.setActive(false);
    } else if (scene === "globe" && !drag && !photoDialog.open && !reduced) {
      yaw += yawVelocity * dt;
      pitch = clamp(pitch + pitchVelocity * dt, -.8, .8);
      yawVelocity *= Math.pow(.94, dt); pitchVelocity *= Math.pow(.94, dt);
    }
    const winners = new Map();
    tiles.forEach((tile, i) => {
      let p;
      if (transition && (transition.kind === "restart" || transition.kind === "envelope")) {
        const progress = clamp((now - transition.start) / transition.duration);
        p = reduced ? { ...transition.from[i], opacity: 1 - progress } :
          mixPosition(transition.from[i], tunnelPosition(tile, i, progress, transition.kind), ease(progress / .22));
      } else if (scene === "finale") {
        p = heartPosition(tile, i, now);
        if (transition && transition.kind === "heart") {
          p = mixPosition(transition.from[i], p, ease((now - transition.start) / transition.duration));
        }
      } else if (scene === "letter" || scene === "sending") {
        p = { x: width / 2 + Math.cos(tile.angle + (reduced ? 0 : now * .00004)) * width * .5,
          y: height / 2 + Math.sin(tile.angle) * height * .55, scale: .65, stretch: 1,
          opacity: .16, rotation: Math.sin(tile.float) * 12, z: 50 };
      } else {
        p = spherePosition(tile, now, i);
        const enter = reduced ? 1 : ease((now - sceneStart) / 1600);
        if (!restore && enter < 1) {
          p.scale *= enter; p.opacity *= enter;
          p.x = lerp(width / 2, p.x, enter); p.y = lerp(height * .44, p.y, enter);
        }
        if (restore) p = mixPosition(restore.from[i], p, ease((now - restore.start) / 1000));
      }
      tile.screen = p;
      tile.el.style.transform = "translate3d(" + (p.x - (width < 600 ? 32 : 39)).toFixed(2) + "px," +
        (p.y - (width < 600 ? 24.5 : 29)).toFixed(2) + "px,0) rotate(" + p.rotation.toFixed(2) +
        "deg) scale(" + (p.scale * p.stretch).toFixed(3) + "," + p.scale.toFixed(3) + ")";
      tile.el.style.opacity = p.opacity.toFixed(3);
      tile.el.style.zIndex = String(Math.round(p.z));
      const interactive = (scene === "globe" || (scene === "finale" && !transition)) && p.opacity > .6;
      tile.el.style.pointerEvents = interactive ? "auto" : "none";
      if (interactive && (!winners.has(tile.index) || p.z > winners.get(tile.index).screen.z)) winners.set(tile.index, tile);
    });
    // One keyboard stop per unique photo, rather than 100+ repeated stops.
    for (const tile of tiles) {
      const accessible = winners.get(tile.index) === tile;
      tile.el.tabIndex = accessible ? 0 : -1;
      tile.el.setAttribute("aria-hidden", String(!accessible));
    }
    if (restore && now - restore.start > 1000) restore = null;
  }

  function drawUniverse(now, dt) {
    if (!ctx) return;
    const quiet = calm() ? .25 : 1, t = now * .001;
    ctx.globalAlpha = 1; ctx.fillStyle = background; ctx.fillRect(0, 0, width, height);
    const nx = pointer.active && !reduced ? pointer.x / width - .5 : 0;
    const ny = pointer.active && !reduced ? pointer.y / height - .5 : 0;
    const warp = scene === "restart" && !reduced ? clamp((now - sceneStart) / 4000) : 0;
    stars.forEach(star => {
      const x = star.x - nx * star.depth * 22, y = star.y - ny * star.depth * 16;
      const alpha = reduced ? star.alpha : star.alpha * (.7 + .3 * Math.sin(t * .9 + star.phase));
      ctx.fillStyle = "rgba(255,234,226," + alpha + ")";
      if (warp > .2) {
        const dx = x - width / 2, dy = y - height / 2;
        ctx.strokeStyle = "rgba(255,226,214," + alpha * warp + ")";
        ctx.lineWidth = star.r * .7; ctx.beginPath(); ctx.moveTo(x, y);
        ctx.lineTo(x + dx * warp * warp * .17, y + dy * warp * warp * .17); ctx.stroke();
      } else { ctx.beginPath(); ctx.arc(x, y, star.r, 0, TAU); ctx.fill(); }
    });
    dust.forEach(d => {
      if (!reduced) {
        if (pointer.active && !calm() && scene !== "restart") {
          const dx = pointer.x - d.x, dy = pointer.y - d.y, distance = Math.hypot(dx, dy);
          if (distance > 4 && distance < 200) {
            const force = (1 - distance / 200) * .11;
            d.vx += (dx / distance * force - dy / distance * force * .8) * dt;
            d.vy += (dy / distance * force + dx / distance * force * .8) * dt;
          }
        }
        d.vx = clamp(d.vx * Math.pow(.987, dt), -3, 3); d.vy = clamp(d.vy * Math.pow(.987, dt), -3, 3);
        d.x += (d.vx + Math.sin(t * .2 + d.phase) * .04) * dt * quiet;
        d.y += (d.vy - .035) * dt * quiet;
        if (d.x < -20) d.x = width + 20; if (d.x > width + 20) d.x = -20;
        if (d.y < -20) d.y = height + 20; if (d.y > height + 20) d.y = -20;
      }
    ctx.fillStyle = "rgba(234,190,211," + (.26 * quiet) + ")";
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
    });
    // A subtle galaxy arc behind the globe.
    ctx.save(); ctx.translate(width * .5, height * .44); ctx.rotate(-.32);
    ctx.scale(1, .22); ctx.lineWidth = 1; ctx.strokeStyle = "#d8b7bc0a";
    ctx.beginPath(); ctx.arc(0, 0, radius * 1.8, 0, TAU); ctx.stroke(); ctx.restore();
    if (reduced) return;
    trails = trails.filter(p => now - p.born < 650);
    trails.forEach((p, i) => {
      const life = 1 - (now - p.born) / 650;
      ctx.fillStyle = "rgba(255,222,199," + life * .5 * quiet + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * life, 0, TAU); ctx.fill();
      if (i > 0 && Math.hypot(p.x - trails[i - 1].x, p.y - trails[i - 1].y) < 100) {
        ctx.strokeStyle = "rgba(255,218,207," + life * .2 * quiet + ")";
        ctx.lineWidth = life * 1.8; ctx.beginPath(); ctx.moveTo(trails[i - 1].x, trails[i - 1].y); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
    });
    if (pointer.active && !calm() && scene !== "restart") {
      const idle = smooth((now - pointer.movedAt - 350) / 800);
      for (let i = 0; i < 3; i++) {
        const a = t * (1.1 + i * .04) + i * TAU / 3, r = 16 + i * 4;
        ctx.fillStyle = "rgba(255,221,199," + idle * .5 + ")";
        ctx.beginPath(); ctx.arc(pointer.x + Math.cos(a) * r, pointer.y + Math.sin(a) * r * .65, 1.1, 0, TAU); ctx.fill();
      }
    }
    rings = rings.filter(r => now - r.born < 1000);
    rings.forEach(r => {
      const p = (now - r.born) / 1000;
      ctx.strokeStyle = "rgba(247,205,221," + (1 - p) * .28 + ")";
      ctx.lineWidth = .8 - p * .5; ctx.beginPath(); ctx.arc(r.x, r.y, 10 + ease(p) * 110, 0, TAU); ctx.stroke();
    });
    bursts = bursts.filter(b => b.life > 0);
    bursts.forEach(b => {
      b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= Math.pow(.984, dt); b.vy += .008 * dt; b.life -= b.decay * dt;
      ctx.fillStyle = "rgba(" + b.color + "," + Math.max(0, b.life) * quiet + ")";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * Math.max(.1, b.life), 0, TAU); ctx.fill();
    });
    if (scene === "intro") {
      const elapsed = now - sceneStart, formation = ease(elapsed / 1700);
      const alpha = clamp(1 - (elapsed - 1500) / 800);
      if (alpha > 0) textPoints.forEach(p => {
        const bend = pointer.active ? 1 - formation : 0;
        const x = lerp(p.fromX, p.x, formation) + (pointer.x - width / 2) * .035 * bend;
        const y = lerp(p.fromY, p.y, formation) + (pointer.y - height / 2) * .035 * bend;
        ctx.fillStyle = "rgba(255,219,222," + alpha * .85 + ")";
        ctx.fillRect(x, y, 1.5, 1.5);
      });
    }
    if (scene === "sending" && !reduced) {
      const elapsed = now - sceneStart;
      if (elapsed > 4500) {
        const reveal = clamp((elapsed - 4500) / 1000);
        const fade = 1 - smooth((elapsed - 6500) / 500);
        const size = clamp(width * .09, 48, 86), cy = height * .43;
        ctx.save();
        ctx.font = "italic " + size + "px 'Playfair Display', Georgia, serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const textWidth = ctx.measureText("20/11").width;
        ctx.beginPath(); ctx.rect(width / 2 - textWidth / 2 - 5, cy - size, (textWidth + 10) * reveal, size * 2); ctx.clip();
        ctx.globalAlpha = fade * .9; ctx.fillStyle = "#ffe9d6";
        ctx.shadowColor = "#e6b3c1"; ctx.shadowBlur = 15;
        ctx.fillText("20/11", width / 2, cy);
        ctx.restore();
        if (reveal < 1) {
          ctx.fillStyle = "rgba(255,230,199," + fade + ")";
          ctx.beginPath(); ctx.arc(width / 2 - textWidth / 2 + textWidth * reveal, cy + Math.sin(reveal * Math.PI * 5) * 12, 2, 0, TAU); ctx.fill();
        }
      }
    }
    if (scene === "restart") {
      const p = clamp((now - sceneStart) / 4000);
      const glow = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, 25 + p * p * Math.max(width, height) * .7);
      glow.addColorStop(0, "rgba(255,243,215," + (.25 + p * .65) + ")");
      glow.addColorStop(.2, "rgba(255,200,200," + p * .2 + ")");
      glow.addColorStop(1, "#ffddcc00"); ctx.fillStyle = glow; ctx.fillRect(0, 0, width, height);
    }
  }

  function frame(now) {
    const seconds = clamp((now - lastFrame) / 1000, 0, .1);
    const dt = clamp((now - lastFrame) / 16.667, .1, 2.5); lastFrame = now;
    const elapsed = now - sceneStart;
    if (scene === "intro") {
      intro.style.opacity = String(reduced ? 1 : smooth((elapsed - 1400) / 850));
      if (elapsed > (reduced ? 1700 : 5200)) {
        intro.style.opacity = "0"; setScene("globe", now); gallery.classList.add("visible");
        envelope.classList.add("ready");
        if (!reduced) hint.classList.add("show");
        burst(width / 2, height * .44, 110, 1.8);
      }
    }
    if (transition && elapsed >= transition.duration && ["envelope", "restart"].includes(transition.kind)) {
      if (transition.kind === "envelope") openLetter();
      else restart(now);
    }
    if (scene === "sending") {
      const foldDuration = reduced ? 100 : 600;
      const flightDuration = reduced ? 0 : 4800;
      if (elapsed > foldDuration) {
        if (letterDialog.open) letterDialog.close();
        const progress = clamp((elapsed - foldDuration) / Math.max(1, flightDuration));
        plane.style.display = reduced || progress >= 1 ? "none" : "block";
        if (!reduced && progress < 1) {
          const p = flightPoint(progress), next = flightPoint(Math.min(1, progress + .001));
          const angle = Math.atan2(next.y - p.y, next.x - p.x) * 180 / Math.PI + 45;
          plane.style.transform = "translate(" + (p.x - 32) + "px," + (p.y - 32) + "px) rotate(" + angle + "deg)";
          trails.push({ x:p.x, y:p.y, born:now, r:1.6 });
        }
        if (elapsed >= foldDuration + flightDuration + (reduced ? 0 : 1600)) startFinale(now);
      }
    }
    if (transition && transition.kind === "heart" && now - heartStart > transition.duration) {
      transition = null; replay.disabled = false; replay.focus({ preventScroll: true });
    }
    if (scene === "restart" && transition) {
      const progress = clamp(elapsed / transition.duration);
      flash.style.opacity = String(smooth((progress - .78) / .22));
      if (musicWanted && !audio.paused) audio.volume = .55 * (1 - progress);
    } else if (flashStart) {
      const progress = clamp((now - flashStart) / 900);
      flash.style.opacity = String(1 - smooth(progress));
      if (musicWanted && !audio.paused) audio.volume = .55 * progress;
      if (progress === 1) flashStart = 0;
    }
    drawUniverse(now, dt); renderTiles(now, dt, seconds);
    if (journey) journey.update(now, seconds, pointer);
    requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) hiddenAt = performance.now();
    else if (hiddenAt) {
      const pause = performance.now() - hiddenAt;
      sceneStart += pause;
      if (transition) transition.start += pause;
      if (restore) restore.start += pause;
      if (flashStart) flashStart += pause;
      if (heartStart) heartStart += pause;
      if (journey) journey.pause(pause);
      hiddenAt = 0; lastFrame = performance.now();
    }
  });
  addEventListener("resize", resize, { passive: true });
  resize();
  if (document.fonts) document.fonts.ready.then(() => { if (scene === "intro") makeTextPoints(); });
  requestAnimationFrame(frame);
})();

}, { once: true });
</script>
</body>
</html>
