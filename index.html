<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090713">
<meta name="description" content="Một món quà nhỏ dành tặng cô Nga nhân ngày Nhà giáo Việt Nam 20/11.">
<title>Gửi cô Nga · 20/11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="experience.css?v=3">
<script src="js/three.js" defer></script>
<script src="js/CSS3DRenderer.js" defer></script>
<script src="globe-physics.js?v=2" defer></script>

</head>
<body data-scene="intro">
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="icon-music" viewBox="0 0 24 24"><path d="M9 17V5l12-2v12M9 8l12-2"/><ellipse cx="6" cy="17" rx="3" ry="2.5"/><ellipse cx="18" cy="15" rx="3" ry="2.5"/></symbol>
<symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="icon-replay" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
<symbol id="icon-flip" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 3M20 3v6h-6M20 15a8 8 0 0 1-14 3l-2-3M4 21v-6h6"/></symbol>
<symbol id="icon-plane" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9L2 9 22 2ZM11 13 22 2"/></symbol>
<symbol id="icon-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="icon-hand" viewBox="0 0 36 42"><path d="M13 21V6a3 3 0 0 1 6 0v12-5a3 3 0 0 1 6 0v6-3a3 3 0 0 1 6 0v8c0 8-5 13-12 13-5 0-7-2-10-6l-5-7c-2-3 2-6 4-3l5 5v-5Z"/></symbol>
</svg>
<canvas id="universe" aria-hidden="true"></canvas>
<div class="scene-vignette" aria-hidden="true"></div>
<header class="topbar">
<span class="date-mark" aria-label="Ngày Nhà giáo Việt Nam 20 tháng 11">20 <i>/</i> 11</span>
<button id="music-button" class="icon-button music-button" aria-label="Bật nhạc" aria-pressed="false"><svg><use href="#icon-music"/></svg><span class="music-slash" aria-hidden="true"></span></button>
</header>
<main id="experience" aria-label="Món quà 20 tháng 11 dành tặng cô Nga">
<section id="intro" class="intro" aria-label="Lời chào">
<h1>Gửi cô Nga<span>một bầu trời yêu thương.</span></h1>
</section>
<section id="gallery" class="gallery" aria-label="Những kỷ niệm" inert>
<div id="globe" class="globe" role="group" aria-label="Kéo để xoay ảnh, chọn một ảnh để xem lớn"></div>
<div id="gesture-hint" class="gesture-hint" aria-hidden="true"><svg><use href="#icon-hand"/></svg><span></span></div>
<button id="envelope-button" class="envelope-button" aria-label="Mở thư dành tặng cô Nga" disabled>
<span class="envelope-aura"></span>
<span class="envelope-body"><span class="envelope-note">♡</span><span class="envelope-flap"></span><span class="envelope-pocket"></span><span class="envelope-seal">♥</span></span>
</button>
</section>
<section id="finale" class="finale" aria-label="Lời chúc" inert>
<div class="finale-copy"><h2>Con chúc cô 20/11<br>sống mạnh khỏe,<br><em>gia đình vui vẻ ạ!</em></h2></div>
<button id="replay-button" class="icon-button replay-button" aria-label="Xem lại từ đầu" disabled><svg><use href="#icon-replay"/></svg></button>
</section>
</main>
<div id="flight-plane" class="flight-plane" aria-hidden="true"><svg><use href="#icon-plane"/></svg></div>
<div id="portal-flash" class="portal-flash" aria-hidden="true"></div>
<div id="cursor-star" class="cursor-star" aria-hidden="true">✦</div>
<dialog id="photo-dialog" class="photo-dialog" aria-label="Xem ảnh kỷ niệm">
<button id="photo-close" class="icon-button dialog-close" aria-label="Đóng ảnh"><svg><use href="#icon-close"/></svg></button>
<button id="photo-prev" class="icon-button photo-nav photo-prev" aria-label="Ảnh trước"><svg><use href="#icon-arrow"/></svg></button>
<figure><img id="large-photo" alt="Ảnh kỷ niệm cùng cô Nga"><figcaption id="photo-count"></figcaption></figure>
<button id="photo-next" class="icon-button photo-nav photo-next" aria-label="Ảnh tiếp theo"><svg><use href="#icon-arrow"/></svg></button>
</dialog>
<dialog id="letter-dialog" class="letter-dialog" aria-label="Lá thư dành tặng cô Nga">
<button id="letter-close" class="icon-button dialog-close" aria-label="Đóng thư"><svg><use href="#icon-close"/></svg></button>
<div id="letter-card" class="letter-card">
<article id="letter-front" class="letter-face letter-front">
<div class="letter-date">20 · 11</div>
<h2>Gửi cô Nga,</h2>
<p>Con chúc cô 20/11 sống mạnh khỏe, gia đình vui vẻ ạ!</p>
<div class="letter-flourish" aria-hidden="true">♡</div><span class="paper-corner" aria-hidden="true"></span>
</article>
<div id="letter-back" class="letter-face letter-back" aria-hidden="true" inert><div id="collage" class="collage"></div><span class="collage-heart" aria-hidden="true">♡</span></div>
</div>
<div class="letter-controls">
<button id="flip-button" class="icon-button" aria-label="Lật thư để xem ảnh" aria-pressed="false"><svg><use href="#icon-flip"/></svg></button>
<button id="send-button" class="icon-button send-button" aria-label="Thả lời chúc lên bầu trời"><svg><use href="#icon-plane"/></svg></button>
</div>
</dialog>
<audio id="background-music" src="image/nhac.mp3" preload="none" loop></audio>
<noscript><p class="noscript">Cô vui lòng bật JavaScript trong trình duyệt để xem món quà này ạ.</p></noscript>
</body>
</html>
